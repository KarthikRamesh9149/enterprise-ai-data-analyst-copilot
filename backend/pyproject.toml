[project]
name = "enterprise-ai-data-analyst-copilot-backend"
version = "0.1.0"
description = "Local-first enterprise AI data analyst and forecasting copilot backend"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.3",
  "bcrypt>=4.3.0",
  "duckdb>=1.1.1",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "langgraph>=0.2.39",
  "mlflow>=2.17.0",
  "numpy>=1.26.4",
  "pandas>=2.2.3",
  "pandera>=0.20.4",
  "polars>=1.8.2",
  "psycopg[binary]>=3.2.3",
  "pydantic-settings>=2.5.2",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.12",
  "redis>=5.1.1",
  "scikit-learn>=1.5.2",
  "sqlglot>=28.0.0",
  "sqlalchemy>=2.0.35",
  "structlog>=24.4.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11.2",
  "pytest>=8.3.3",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
